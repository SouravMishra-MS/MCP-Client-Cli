[project]
name = "mcp-client"
version = "0.1.0"
description = "Universal MCP client supporting stdio, SSE, and HTTP transports"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.2",
    "inquirer>=3.4.1",
    "mcp>=1.22.0",
    "openai>=2.8.1",
    "prompt_toolkit>=3.0.0",
    "rich>=14.2.0",
    "tabulate>=0.9.0",
    "yaspin>=3.4.0",
]
authors = [
    {name = "Sourav Mishra", email = "soumi@microsoft.com"}
]
license = {text = "MIT"}
keywords = ["mcp", "client", "openai"]


[project.scripts]
mcp-client = "client.__main__:cli_main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["client*"]  # Only include mcp_client package

